name: Godot Android APK + Live Updates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-world-godot-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Android export paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Validate and import Godot project
        run: godot --headless --editor --path godot --quit
      - name: Export native Godot Android APK
        run: godot --headless --path godot --export-debug "Android" "$GITHUB_WORKSPACE/OPEN-WORLD-GODOT.apk" --verbose
      - name: Export remote Godot content pack
        run: godot --headless --path godot --export-pack "Android" "$GITHUB_WORKSPACE/game-update.pck"
      - name: Verify APK and update pack
        run: |
          test -s "$GITHUB_WORKSPACE/OPEN-WORLD-GODOT.apk"
          test -s "$GITHUB_WORKSPACE/game-update.pck"
          unzip -t "$GITHUB_WORKSPACE/OPEN-WORLD-GODOT.apk"
          sha256sum "$GITHUB_WORKSPACE/game-update.pck"
      - name: Publish live content pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view vms-city-live --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload vms-city-live "$GITHUB_WORKSPACE/game-update.pck" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create vms-city-live "$GITHUB_WORKSPACE/game-update.pck" --title "Open World live update" --notes "Pacote remoto do jogo Godot." --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish verified update manifests
        run: |
          VERSION="$GITHUB_RUN_NUMBER"
          PACK_SHA="$(sha256sum "$GITHUB_WORKSPACE/game-update.pck" | awk '{print $1}')"
          CONFIG_SHA="$(sha256sum content/world.json | awk '{print $1}')"
          cat > updates/manifest.json <<EOF
          {
            "version": $VERSION,
            "pck_url": "https://github.com/$GITHUB_REPOSITORY/releases/download/vms-city-live/game-update.pck",
            "sha256": "$PACK_SHA"
          }
          EOF
          cat > content/manifest.json <<EOF
          {
            "version": $VERSION,
            "content_url": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/content/world.json",
            "sha256": "$CONFIG_SHA"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/manifest.json content/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Godot live update v$VERSION [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPEN-WORLD-GODOT-ANDROID
          path: OPEN-WORLD-GODOT.apk
          if-no-files-found: error