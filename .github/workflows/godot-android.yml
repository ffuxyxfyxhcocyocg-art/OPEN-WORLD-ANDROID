name: SR Battle Royale Android

on:
  push:
    branches: [sr-battleroyale-godot]
    paths:
      - "godot/**"
      - ".github/workflows/godot-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "ndk;27.2.12479018" "cmake;3.10.2.4988404"

      - name: Download Godot 4.4.1 and Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Copy existing Midas 3D model for Godot import
        run: |
          mkdir -p godot/models
          cp app/src/main/assets/game/models/midas.glb godot/models/midas.glb

      - name: Validate project and import assets
        run: |
          /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --quit

      - name: Check native battle royale script
        run: |
          /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --check-only --script res://scripts/battle_royale.gd

      - name: Smoke-test native game scene
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --quit-after 90 2>&1 | tee /tmp/sr-game-smoketest.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call\.|Invalid access to property" /tmp/sr-game-smoketest.log; then
            echo "Godot runtime script errors detected."
            exit 1
          fi

      - name: Verify scene content, multiplayer and Midas import
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://scripts/verify_scene.gd 2>&1 | tee /tmp/sr-scene-verify.log
          if ! grep -q "SMOKE PASS" /tmp/sr-scene-verify.log; then
            echo "Native scene verification did not pass."
            exit 1
          fi

      - name: Export Android APK
        run: |
          mkdir -p godot/build
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore" GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey" GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android" /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --verbose --path godot --export-debug "Android" build/OpenWorldBR-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-BattleRoyale-Android
          path: godot/build/OpenWorldBR-debug.apk
          if-no-files-found: error

      - name: Publish APK release for in-game updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-sr-br
          name: SR Battle Royale Android v0.3.0
          make_latest: true
          overwrite_files: true
          files: godot/build/OpenWorldBR-debug.apk
