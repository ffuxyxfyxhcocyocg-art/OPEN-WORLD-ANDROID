name: SR ZERO Android

on:
  push:
    branches: [sr-battleroyale-do-zero]
    paths:
      - "game/**"
      - ".github/workflows/sr-zero-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" "ndk;27.2.12479018"
      - name: Download Godot 4.4.1 and export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Android debug signing
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=SRZERO Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Import Godot project
        run: |
          /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --editor --quit
      - name: Verify independent game scene
        run: |
          set -o pipefail
          /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --script res://scripts/verify.gd 2>&1 | tee /tmp/verification.log
          grep "ZERO PASS" /tmp/verification.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Invalid call\.|Invalid access to property" /tmp/verification.log; then
            exit 1
          fi
      - name: Build Android APK
        run: |
          mkdir -p game/build
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore" GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey" GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android" /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path game --export-debug "Android" build/SR-BattleRoyale-Zero.apk
          test -s game/build/SR-BattleRoyale-Zero.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-BattleRoyale-ZERO-APK
          path: game/build/SR-BattleRoyale-Zero.apk
          if-no-files-found: error
