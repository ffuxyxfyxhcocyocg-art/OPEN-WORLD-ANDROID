function updateProceduralWalk(dt,running){
 if(!proceduralBones.length)return;
 gaitClock+=dt*(running?9:2.1);
 const swing=running?Math.sin(gaitClock)*.58:Math.sin(gaitClock)*.025;

  let angle=0;
  if(item.kind==='thigh')angle=swing*item.side;
  else if(item.kind==='knee')angle=Math.max(0,swing*item.side)*.9;
  else if(item.kind==='arm')angle=-swing*item.side*.72;
  else if(item.kind==='forearm')angle=Math.max(0,-swing*item.side)*.28;
  else if(item.kind==='foot')angle=-swing*item.side*.16;
  item.bone.quaternion.copy(item.base).multiply(new THREE.Quaternion().setFromAxisAngle(item.axis,angle));
 }

function attachCharacter(model,animations=[],label='Personagem GLB'){
  // Mantém a hierarquia, os materiais e o esqueleto originais do arquivo GLB.
  const visualRoot=new THREE.Group();
  visualRoot.name='MidasVisualRoot';
  visualRoot.add(model);
  model.updateMatrixWorld(true);
  // Calcula os limites a partir das geometrias dos meshes. Em GLBs com
  // esqueleto/animação, o Box3 automático pode retornar altura zero ou inválida.
  // Mede o modelo já com a hierarquia e as matrizes atualizadas.
  // setFromObject(..., true) percorre os vértices reais e considera a pose
  // dos SkinnedMesh; boundingBox da geometria isolada pode ter altura zero
  // em personagens GLB com esqueleto.
  model.updateMatrixWorld(true);
  model.traverse(o=>{if(o.isSkinnedMesh&&o.skeleton)o.skeleton.update();});
  let bounds=new THREE.Box3().setFromObject(model,true);
  let size=bounds.getSize(new THREE.Vector3());
  if(!Number.isFinite(size.y)||size.y<0.05){
   // Segunda tentativa: união dos limites locais de cada mesh transformados
   // para o espaço do modelo, sem depender da caixa global do GLB.
   bounds.makeEmpty();
   model.traverse(o=>{
    if(!o.isMesh||!o.geometry)return;
    const geometry=o.geometry;
    if(!geometry.boundingBox)geometry.computeBoundingBox();
    if(!geometry.boundingBox)return;
    const meshBounds=geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    if(Number.isFinite(meshBounds.min.x)&&Number.isFinite(meshBounds.min.y)&&Number.isFinite(meshBounds.min.z)&&Number.isFinite(meshBounds.max.x)&&Number.isFinite(meshBounds.max.y)&&Number.isFinite(meshBounds.max.z))bounds.union(meshBounds);
   });
   size=bounds.getSize(new THREE.Vector3());
  }
  if(bounds.isEmpty()||!Number.isFinite(size.y)||size.y<0.05||!Number.isFinite(size.x)||!Number.isFinite(size.z)){
   throw new Error('limites 3D inválidos: '+size.x+' × '+size.y+' × '+size.z);
  }
  const center=bounds.getCenter(new THREE.Vector3());
  const scale=1.8/size.y;
  visualRoot.scale.setScalar(scale);
  visualRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
  model.traverse(o=>{
   o.visible=true;
   if(o.isMesh){
    o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;
    if(o.geometry&&!o.geometry.boundingSphere)o.geometry.computeBoundingSphere();

   }
  });

  player.add(visualRoot);

  visualRoot.updateMatrixWorld(true);
  characterReady=true;
  characterMixer=new THREE.AnimationMixer(model);
  const idleClip=animations.find(a=>/idle|breath|stand/i.test(a.name))||animations[0];
  const runClip=animations.find(a=>/run|walk|jog/i.test(a.name));
  idleAction=idleClip?characterMixer.clipAction(idleClip):null;
  runAction=runClip?characterMixer.clipAction(runClip):null;
  proceduralBones=[];

   model.traverse(o=>{
    if(!o.isBone)return;
    const n=(o.name||'').toLowerCase().replace(/[^a-z0-9_.]/g,'');
    // Identifica o lado pela posição real do osso no espaço do modelo.

    else if(/lowerleg|calf|shin|knee/.test(n))kind='knee';
    else if(/upperarm|shoulder|arm/.test(n)&&!/forearm|lowerarm/.test(n))kind='arm';
    else if(/forearm|lowerarm/.test(n))kind='forearm';
    else if(/foot|ankle/.test(n))kind='foot';
    if(kind&&side){
     // Converte o eixo de balanço global para o eixo local de cada osso.
     const worldQ=new THREE.Quaternion();o.getWorldQuaternion(worldQ);

 }

// Colisão circular contra os limites dos edifícios; movimento por eixo evita prender nas quinas.
function blockedAt(x,z,r){return collisionRects.some(b=>x+r>b.minX&&x-r<b.maxX&&z+r>b.minZ&&z-r<b.maxZ)}
function moveWithCollision(obj,dx,dz,r){const nx=obj.position.x+dx;if(!blockedAt(nx,obj.position.z,r))obj.position.x=nx;const nz=obj.position.z+dz;if(!blockedAt(obj.position.x,nz,r))obj.position.z=nz;}
let driving=false,speed=0,yaw=0,cameraYaw=0,jump=0,move={x:0,y:0},last=performance.now();
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub'),look=document.querySelector('#look');let pointer=null,lookPointer=null,lastLookX=0;
look.addEventListener('pointerdown',e=>{lookPointer=e.pointerId;lastLookX=e.clientX;look.setPointerCapture(lookPointer);e.preventDefault()});
look.addEventListener('pointermove',e=>{if(e.pointerId!==lookPointer)return;const dx=e.clientX-lastLookX;lastLookX=e.clientX;cameraYaw-=dx*.008;e.preventDefault()});
function releaseLook(e){if(e.pointerId===lookPointer)lookPointer=null}
look.addEventListener('pointerup',releaseLook);look.addEventListener('pointercancel',releaseLook);
function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=43,k=Math.min(1,max/(len||1));move.x=dx*k/max;move.y=-dy*k/max;nub.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);setStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setStick(e)});
function release(e){if(e.pointerId===pointer){pointer=null;move={x:0,y:0};nub.style.transform=''}}
stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
document.querySelector('#vehicle').onclick=()=>{if(driving){driving=false;player.position.copy(car.position);player.position.x+=Math.cos(yaw)*2;player.position.z+=Math.sin(yaw)*2;document.querySelector('#vehicle').textContent='ENTRAR'}else if(player.position.distanceTo(car.position)<5){driving=true;player.position.copy(car.position);document.querySelector('#vehicle').textContent='SAIR'}};

// HUD de combate: seleção de slots, munição, recarga e minimapa.
const combat={health:100,shield:100,slot:0,ammo:[30,12,1],reserve:[120,48,0],reloading:false};
const ammoLabel=document.querySelector('#ammo'),toast=document.querySelector('#combat-toast');
function combatToast(message){toast.textContent=message;toast.style.opacity='1';clearTimeout(combatToast.timer);combatToast.timer=setTimeout(()=>toast.style.opacity='0',1100);}
function refreshCombat(){document.querySelector('#health-num').textContent=combat.health;document.querySelector('#shield-num').textContent=combat.shield;document.querySelector('#health-fill').style.width=combat.health+'%';document.querySelector('#shield-fill').style.width=combat.shield+'%';ammoLabel.textContent=combat.ammo[combat.slot]+' / '+combat.reserve[combat.slot];document.querySelectorAll('.weapon-slot').forEach((b,i)=>b.classList.toggle('active',i===combat.slot));}

document.querySelector('#fire').addEventListener('click',()=>{if(driving){combatToast('SAIA DO VEÍCULO PARA USAR');return;}if(combat.reloading)return;if(combat.ammo[combat.slot]<=0){combatToast('SEM MUNIÇÃO • RECARREGUE');return;}combat.ammo[combat.slot]--;refreshCombat();combatToast('DISPARO');});
document.querySelector('#reload').addEventListener('click',()=>{if(combat.reloading||combat.slot===2)return;if(combat.ammo[combat.slot]>=([30,12][combat.slot])||combat.reserve[combat.slot]<=0){combatToast('NÃO PRECISA RECARREGAR');return;}combat.reloading=true;combatToast('RECARREGANDO...');setTimeout(()=>{const cap=[30,12][combat.slot],need=cap-combat.ammo[combat.slot],take=Math.min(need,combat.reserve[combat.slot]);combat.ammo[combat.slot]+=take;combat.reserve[combat.slot]-=take;combat.reloading=false;refreshCombat();combatToast('RECARREGADO');},1250);});


/* Fases locais inspiradas no TABGCppServer. Multiplayer online ainda requer servidor conectado. */
const match={state:"waiting",elapsed:0,waiting:12,flying:5,players:[{id:"local-player",team:1,connected:true}]};
const phaseState=document.querySelector("#phase-state");
const phaseClock=document.querySelector("#phase-clock");

const networkLine=document.createElement("small");
networkLine.id="network-state";
networkLine.textContent="● OFFLINE • SERVIDOR NÃO CONFIGURADO";
networkLine.style.cssText="display:block;text-align:center;padding:4px;background:#111923e8;border-top:1px solid #ffffff22;font-size:9px;color:#ffd45b";
document.querySelector("#match-info").appendChild(networkLine);
const remotePlayers=new Map();
let networkSocket=null,networkSnapshot=null,networkSendClock=0,networkPlayerId=null;
const serverFromUrl=new URLSearchParams(location.search).get("server");
const networkUrl=window.OPEN_WORLD_SERVER_URL||serverFromUrl||"";
function connectOnline(){
 if(!networkUrl){networkLine.textContent="● OFFLINE • AGUARDANDO HOSPEDAGEM";return;}
 try{
  networkLine.textContent="● CONECTANDO AO SERVIDOR...";
  networkSocket=new WebSocket(networkUrl);
  networkSocket.addEventListener("open",()=>{networkLine.textContent="● ONLINE • CONECTADO";networkSocket.send(JSON.stringify({type:"join",name:"Jogador"}));});
  networkSocket.addEventListener("message",event=>{
   let data;try{data=JSON.parse(event.data)}catch{return}
   if(data.type==="welcome"){networkPlayerId=data.id;return}
   if(data.type==="full"){networkLine.textContent="● SALA CHEIA";return}
   if(data.type!=="snapshot")return;
   networkSnapshot=data;
   match.players=Array.from({length:data.playerCount||1},(_,i)=>({id:String(i),connected:true}));
   networkLine.textContent="● ONLINE • "+data.playerCount+"/"+data.maxPlayers+" JOGADORES";
   const alive=new Set();
   for(const p of data.players||[]){
    if(p.id===networkPlayerId)continue;
    alive.add(p.id);
    let avatar=remotePlayers.get(p.id);
    if(!avatar){
     avatar=new THREE.Group();
     const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.85,3,7),new THREE.MeshStandardMaterial({color:0x35a9ff,roughness:.8}));
     torso.position.y=1;avatar.add(torso);
     const head=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),new THREE.MeshStandardMaterial({color:0xc99570}));
     head.position.y=1.68;avatar.add(head);scene.add(avatar);remotePlayers.set(p.id,avatar);
    }
    avatar.position.set(p.x||0,0,p.z||0);avatar.rotation.y=p.yaw||0;
   }
   for(const [id,avatar] of remotePlayers)if(!alive.has(id)){scene.remove(avatar);remotePlayers.delete(id);}
  });
  networkSocket.addEventListener("close",()=>{networkLine.textContent="● DESCONECTADO • TENTANDO NOVAMENTE";networkSnapshot=null;setTimeout(connectOnline,4000);});
  networkSocket.addEventListener("error",()=>{networkLine.textContent="● FALHA NA CONEXÃO";});
 }catch(e){networkLine.textContent="● URL DO SERVIDOR INVÁLIDA";}
}
connectOnline();
function updateNetwork(dt){
 if(!networkSocket||networkSocket.readyState!==WebSocket.OPEN)return;
 networkSendClock+=dt;
 if(networkSendClock<.1)return;
 networkSendClock=0;
 const p=driving?car.position:player.position;
 networkSocket.send(JSON.stringify({type:"state",x:p.x,z:p.z,yaw:driving?yaw:player.rotation.y,vehicle:!!driving}));
}

function updateMatchPhase(dt){
 if(networkSnapshot){
  match.state=networkSnapshot.phase;
  match.elapsed=networkSnapshot.matchElapsed||0;
  let remaining=Math.ceil(networkSnapshot.phaseRemaining||0);
  if(match.state==="waiting"){phaseState.textContent="● LOBBY • "+networkSnapshot.playerCount+"/40 JOGADORES";phaseClock.textContent="PARTIDA COMEÇA EM 00:"+String(remaining).padStart(2,"0");}
  else if(match.state==="countdown"){phaseState.textContent="● CONTAGEM REGRESSIVA";phaseClock.textContent="INICIANDO EM 00:"+String(remaining).padStart(2,"0");}
  else{phaseState.textContent="● PARTIDA EM ANDAMENTO";phaseClock.textContent="JOGADORES ONLINE: "+networkSnapshot.playerCount;}
  return;
 }
 match.elapsed+=dt;
 let remaining=0;
 if(match.state==="waiting"){
  remaining=Math.max(0,match.waiting-match.elapsed);
  phaseState.textContent="● LOBBY • "+match.players.filter(p=>p.connected).length+"/40 JOGADOR";
  phaseClock.textContent="PARTIDA COMEÇA EM 00:"+String(Math.ceil(remaining)).padStart(2,"0");
  if(remaining<=0){match.state="countdown";match.elapsed=0;combatToast("PREPARE-SE PARA A PARTIDA");}
 }else if(match.state==="countdown"){
  remaining=Math.max(0,match.flying-match.elapsed);
  phaseState.textContent="● CONTAGEM REGRESSIVA";
  phaseClock.textContent="INICIANDO EM 00:"+String(Math.ceil(remaining)).padStart(2,"0");
  if(remaining<=0){match.state="started";match.elapsed=0;zone.elapsed=0;zone.damageClock=0;combatToast("PARTIDA INICIADA");}
 }else if(match.state==="started"){
  phaseState.textContent="● PARTIDA EM ANDAMENTO";
  phaseClock.textContent="SOBREVIVA • ZONA ATIVA";
  if(combat.health<=0){match.state="ended";match.elapsed=0;}
 }else{
  phaseState.textContent="● PARTIDA ENCERRADA";
  phaseClock.textContent="FIM DE JOGO • REINICIE PARA JOGAR";
 }
}

/* Zona segura funcional: espera, fechamento gradual e dano fora do círculo. */
const zone={startRadius:150,endRadius:24,wait:15,shrink:90,elapsed:0,radius:150,damageClock:0};
const zoneRing=new THREE.Mesh(
 new THREE.TorusGeometry(zone.startRadius,.72,8,160),
 new THREE.MeshStandardMaterial({color:0xffc83d,emissive:0xff5a16,emissiveIntensity:1.15,transparent:true,opacity:.94})
);
zoneRing.rotation.x=Math.PI/2;zoneRing.position.set(0,.42,0);zoneRing.renderOrder=4;scene.add(zoneRing);
const zoneWarning=document.querySelector('#zone-warning');
function updateZone(dt){
 if(networkSnapshot){
  if(networkSnapshot.phase!=="started")return;
  zone.elapsed=networkSnapshot.zoneElapsed||0;
  zone.radius=networkSnapshot.zoneRadius||zone.startRadius;
 }else{
  if(match.state!=="started")return;
  zone.elapsed+=dt;
 }

 const closing=Math.max(0,zone.elapsed-zone.wait);
 const progress=THREE.MathUtils.clamp(closing/zone.shrink,0,1);
 zone.radius=THREE.MathUtils.lerp(zone.startRadius,zone.endRadius,progress);
 zoneRing.scale.setScalar(zone.radius/zone.startRadius);
 const remaining=zone.elapsed<zone.wait?zone.wait-zone.elapsed:Math.max(0,zone.shrink-closing);
 const clock=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(Math.floor(remaining%60)).padStart(2,'0');
 if(zone.elapsed<zone.wait)zoneWarning.textContent='⚠ ZONA FECHA EM '+clock;
 else if(progress<1)zoneWarning.textContent='⚠ ZONA DIMINUINDO • '+clock;
 else zoneWarning.textContent='⚠ ZONA FINAL • PERMANEÇA DENTRO';
 const p=driving?car.position:player.position;
 if(Math.hypot(p.x,p.z)>zone.radius){
  zone.damageClock+=dt;
  if(zone.damageClock>=1){zone.damageClock=0;combat.health=Math.max(0,combat.health-5);refreshCombat();if(combat.health===0)combatToast('VOCÊ FOI ELIMINADO PELA ZONA');}
 }else zone.damageClock=0;
}
const mapCanvas=document.querySelector('#minimap'),mapCtx=mapCanvas.getContext('2d');
function drawMinimap(){const w=mapCanvas.width,h=mapCanvas.height;mapCtx.clearRect(0,0,w,h);mapCtx.fillStyle='#263b35';mapCtx.fillRect(0,0,w,h);mapCtx.strokeStyle='#9aa89a';mapCtx.lineWidth=9;for(let i=0;i<5;i++){mapCtx.beginPath();mapCtx.moveTo(i*65-20,0);mapCtx.lineTo(i*65+55,h);mapCtx.stroke();}mapCtx.strokeStyle='#ffb52e';mapCtx.lineWidth=4;mapCtx.beginPath();mapCtx.arc(w/2,h/2,91*(zone.radius/zone.startRadius),0,Math.PI*2);mapCtx.stroke();const px=w/2+player.position.x*1.1,pz=h/2+player.position.z*1.1;mapCtx.fillStyle='#ffdf45';mapCtx.beginPath();mapCtx.arc(Math.max(8,Math.min(w-8,px)),Math.max(8,Math.min(h-8,pz)),8,0,Math.PI*2);mapCtx.fill();mapCtx.strokeStyle='#fff';mapCtx.lineWidth=2;mapCtx.stroke();}

function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;
 updateMatchPhase(dt);
 updateZone(dt);
 const heading=((cameraYaw*180/Math.PI)%360+360)%360;
 const compass=document.getElementById('compass-readout');
 if(compass)compass.textContent='NAVEGAÇÃO  '+String(Math.round(heading)).padStart(3,'0')+'°';
 if(driving){if(Math.abs(move.y)>.03){yaw+=move.x*dt*1.7*Math.sign(move.y);speed=THREE.MathUtils.damp(speed,move.y*13,2.5,dt)}else speed=THREE.MathUtils.damp(speed,0,2,dt);car.rotation.y=yaw;moveWithCollision(car,-Math.sin(yaw)*speed*dt,-Math.cos(yaw)*speed*dt,1.45)}
 else{const forward=camera.getWorldDirection(new THREE.Vector3());forward.y=0;forward.normalize();const right=new THREE.Vector3(-forward.z,0,forward.x);const direction=right.multiplyScalar(move.x).add(forward.multiplyScalar(move.y));if(direction.lengthSq()>.0001){direction.normalize();moveWithCollision(player,direction.x*5*dt,direction.z*5*dt,.48);player.rotation.y=Math.atan2(direction.x,direction.z)}}
 updateNetwork(dt);
 updateCharacterAnimation(!driving&&Math.hypot(move.x,move.y)>.1);
 if(characterMixer)characterMixer.update(dt);
 if(characterReady&&!runAction)updateProceduralWalk(dt,!driving&&Math.hypot(move.x,move.y)>.1);
 if(jump>0){player.position.y=Math.sin((1-jump)*Math.PI)*1.1;jump-=dt*1.7;if(jump<=0){jump=0;player.position.y=0}}
 // O personagem acompanha player diretamente.
 const target=driving?car.position:player.position;const angle=driving?yaw:cameraYaw;
 const desired=new THREE.Vector3(target.x+Math.sin(angle)*14,8.2,target.z+Math.cos(angle)*14);
 camera.position.lerp(desired,.12);camera.lookAt(target.x,1.6,target.z);
 drawMinimap();renderer.render(scene,camera);
}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
if(!characterReady)status.textContent='Carregando personagem 3D...';
</script></body></html>
