function attachCharacter(model,animations=[],label='Personagem GLB'){
  // Mantém a hierarquia, os materiais e o esqueleto originais do arquivo GLB.
  const visualRoot=new THREE.Group();
  visualRoot.name='MidasVisualRoot';
  visualRoot.add(model);
  model.updateMatrixWorld(true);
  // Calcula os limites a partir das geometrias dos meshes. Em GLBs com
  // esqueleto/animação, o Box3 automático pode retornar altura zero ou inválida.
  let bounds=new THREE.Box3();
  model.traverse(o=>{
   if(!o.isMesh||!o.geometry) return;
   const geometry=o.geometry;
   if(!geometry.boundingBox) geometry.computeBoundingBox();
   if(!geometry.boundingBox) return;
   const meshBounds=geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
   if(Number.isFinite(meshBounds.min.x)&&Number.isFinite(meshBounds.min.y)&&Number.isFinite(meshBounds.min.z)&&Number.isFinite(meshBounds.max.x)&&Number.isFinite(meshBounds.max.y)&&Number.isFinite(meshBounds.max.z)) bounds.union(meshBounds);
  });
  let size=bounds.getSize(new THREE.Vector3());
  if(!Number.isFinite(size.y)||size.y<0.05){
   bounds=new THREE.Box3().setFromObject(model);
   size=bounds.getSize(new THREE.Vector3());
  }
  if(!Number.isFinite(size.y)||size.y<0.05) throw new Error('não foi possível medir a altura ('+size.y+')');
  const center=bounds.getCenter(new THREE.Vector3());
  const scale=1.8/size.y;
  visualRoot.scale.setScalar(scale);
  visualRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
  model.traverse(o=>{
   o.visible=true;
   if(o.isMesh){
    o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;
    if(o.geometry&&!o.geometry.boundingSphere)o.geometry.computeBoundingSphere();
    if(o.isSkinnedMesh&&o.skeleton)o.skeleton.update();
    const materials=Array.isArray(o.material)?o.material:[o.material];
    materials.forEach(m=>{if(!m)return;m.visible=true;if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;m.needsUpdate=true;});
   }
  });
  body.visible=false;head.visible=false;
  player.clear();player.rotation.set(0,0,0);player.visible=true;
  player.add(visualRoot);
  visualRoot.visible=true;
  visualRoot.updateMatrixWorld(true);
  characterReady=true;
  characterMixer=new THREE.AnimationMixer(model);
  const idleClip=animations.find(a=>/idle|breath|stand/i.test(a.name))||animations[0];
  const runClip=animations.find(a=>/run|walk|jog/i.test(a.name));
  idleAction=idleClip?characterMixer.clipAction(idleClip):null;
  runAction=runClip?characterMixer.clipAction(runClip):null;
  if(idleAction)idleAction.play();
  status.textContent=label+(runAction?' • idle/corrida prontos':' • modelo carregado');
 }function loadFallbackFBX(){
 characterLoader.load(characterBase+'Ch46_nonPBR.fbx',model=>{
  const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());
  const scale=1.8/Math.max(size.y,.001);
  model.scale.setScalar(scale);
  model.position.set(-((bounds.min.x+bounds.max.x)/2)*scale,-bounds.min.y*scale,-((bounds.min.z+bounds.max.z)/2)*scale);
  model.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;const materials=Array.isArray(o.material)?o.material:[o.material];materials.forEach(m=>{if(!m)return;m.normalMap=null;m.bumpMap=null;m.roughnessMap=null;m.metalnessMap=null;m.aoMap=null;m.roughness=.88;m.metalness=0;if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;m.needsUpdate=true;});});
  player.clear();player.rotation.set(0,0,0);model.rotation.set(0,0,0);player.add(model);characterReady=true;
  characterMixer=new THREE.AnimationMixer(model);
  characterLoader.load(animationBase+'Ch46_nonPBR@Breathing%20Idle.fbx',idle=>{if(idle.animations.length){idleAction=characterMixer.clipAction(idle.animations[0]);if(!isMoving)idleAction.play();}});

  status.textContent='Personagem reserva FBX carregado • motivo do Midas: '+(midasFailureReason||'falha não identificada');
 },undefined,error=>{console.error('Falha no FBX reserva:',error);status.textContent='Falha ao carregar personagem 3D';});
}
async function loadMidasGLB(){
 const url=midasUrl+'?v=26&t='+Date.now();

  status.textContent='Baixando personagem Midas...';
  const response=await fetch(url,{cache:'no-store'});

  const data=await response.arrayBuffer();
  if(data.byteLength<20)throw new Error('Arquivo GLB vazio/incompleto ('+data.byteLength+' bytes)');
  if(new DataView(data).getUint32(0,true)!==0x46546C67)throw new Error('Arquivo recebido não possui assinatura GLB válida');

// Colisão circular contra os limites dos edifícios; movimento por eixo evita prender nas quinas.
function blockedAt(x,z,r){return collisionRects.some(b=>x+r>b.minX&&x-r<b.maxX&&z+r>b.minZ&&z-r<b.maxZ)}
function moveWithCollision(obj,dx,dz,r){const nx=obj.position.x+dx;if(!blockedAt(nx,obj.position.z,r))obj.position.x=nx;const nz=obj.position.z+dz;if(!blockedAt(obj.position.x,nz,r))obj.position.z=nz;}
