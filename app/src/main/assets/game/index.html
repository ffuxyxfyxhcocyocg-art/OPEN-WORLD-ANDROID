<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10243a"><title>VMS RUN</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142a3c;color:#fff;font-family:Arial;touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}#logo{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:36px;font-weight:1000;letter-spacing:3px;color:#ffe34e;-webkit-text-stroke:1px #813e16}#stats{position:absolute;top:12px;left:10px;background:#081626c9;border:1px solid #ffffff66;border-radius:12px;padding:9px;font-weight:bold;line-height:1.6}#stats b{color:#ffe34e}#pause{position:absolute;right:12px;top:12px;pointer-events:auto;background:#10243add;color:white;border:1px solid white;border-radius:12px;padding:12px}#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#06132388}#panel{width:min(88vw,370px);padding:25px;text-align:center;border:2px solid #ffffff77;border-radius:22px;background:linear-gradient(145deg,#14506a,#101a35);box-shadow:0 15px 50px #0009}h1{font-size:48px;color:#ffe34e;margin:0 0 8px;text-shadow:0 4px #914416}.primary,.secondary{width:100%;padding:15px;margin-top:12px;border:0;border-radius:13px;font-weight:900}.primary{background:linear-gradient(#ffed72,#ff9d24);color:#48220b;font-size:17px}.secondary{background:#ffffff20;color:white;border:1px solid #ffffff66}#controls{position:fixed;inset:0;z-index:3;pointer-events:none}#left,#right,#jump,#slide{position:absolute;pointer-events:auto;border:1px solid #ffffffaa;background:#0b1d30dd;color:white;border-radius:16px;font-size:19px;font-weight:bold;width:57px;height:57px;bottom:16px}#left{left:12px}#right{left:77px}#jump,#slide{right:12px;width:70px;font-size:12px}#jump{bottom:82px;background:#d99124;color:#231600}#tip{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;text-shadow:0 2px 4px #000}@media(max-height:430px){#left,#right,#jump,#slide{bottom:8px;width:50px;height:48px}#jump{right:70px}#slide{right:12px}#tip{display:none}}</style></head><body><canvas id="c"></canvas><div id="hud"><div id="logo">VMS RUN</div><div id="stats">PONTOS <b id="score">0</b><br>MOEDAS <b id="coins">0</b><br>RECORDE <b id="best">0</b></div><button id="pause">Ⅱ</button></div><div id="controls"><button id="left">◀</button><button id="right">▶</button><button id="jump">▲ PULAR</button><button id="slide">▼ ABAIXAR</button><div id="tip">DESLIZE PARA MUDAR DE PISTA</div></div><div id="overlay"><div id="panel"><h1>VMS RUN</h1><p>Corra pelos trilhos, desvie dos trens e colete moedas!</p><button class="primary" id="start">COMEÇAR</button></div></div><script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let w,h,d=1,t=0,last=0,run=false,lane=0,j=0,s=0,coin=0,spd=.36,spawn=0,items=[],best=+(localStorage.vmsrunBest||0);$('best').textContent=best;
function size(){d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}onresize=size;size();
function rr(a,b,c,d,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,c,d,r);x.fill()}
function pos(z,l){let q=1-z;return [w/2+l*w*(.045+q*.43),h*.27+q*h*.75,.2+q*1.25]}
function add(){let l=Math.floor(Math.random()*3)-1,kind=Math.random()<.43?'coin':Math.random()<.58?'block':'train';items.push({l,z:0,kind,done:false});if(kind==='coin')for(let k=1;k<5;k++)items.push({l,z:-k*.13,kind,done:false})}
function world(){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#58b6df');g.addColorStop(.48,'#e8c78f');g.addColorStop(.49,'#3e805b');g.addColorStop(1,'#183d37');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#f9d98d';x.beginPath();x.arc(w*.8,h*.18,Math.min(w,h)*.07,0,7);x.fill();
for(let side of [-1,1])for(let k=0;k<8;k++){let z=(k/8+t*.1)%1,[a,b,q]=pos(z,side*2),bw=22*q,bh=75*q;rr(a-bw/2,b-bh,bw,bh,3,k%2?'#bd6845':'#d4a35f')}
x.fillStyle='#44484a';x.beginPath();x.moveTo(w*.42,h*.27);x.lineTo(w*.58,h*.27);x.lineTo(w*.98,h);x.lineTo(w*.02,h);x.fill();for(let l=-1;l<=1;l++){x.strokeStyle='#d9d0b8';x.lineWidth=2;x.beginPath();x.moveTo(w/2+l*w*.045,h*.27);x.lineTo(w/2+l*w*.45,h);x.stroke()}
for(let k=0;k<16;k++){let z=(k/16+t*spd)%1,[a,b,q]=pos(z,0);x.fillStyle='#b5a58b';x.fillRect(a-w*q*.45,b,w*q*.9,Math.max(2,q*4))}
items.sort((a,b)=>a.z-b.z);for(let o of items){let [a,b,q]=pos(o.z,o.l);if(o.kind==='coin'){x.fillStyle='#ffdf35';x.strokeStyle='#fff3a0';x.lineWidth=3;x.beginPath();x.arc(a,b-17*q,10*q,0,7);x.fill();x.stroke()}else if(o.kind==='train'){rr(a-31*q,b-82*q,62*q,82*q,6*q,'#d54c36');rr(a-24*q,b-68*q,48*q,25*q,4*q,'#9ce4e8')}else{rr(a-28*q,b-34*q,56*q,34*q,5*q,'#e8a33e')}}
let a=w/2+lane*w*.18,b=h*.79-j*h*.19,q=Math.min(w,h)/390;x.save();x.translate(a,b);x.scale(q,q);x.strokeStyle='#17263c';x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(-7,-17);x.lineTo(-13,0);x.moveTo(8,-17);x.lineTo(14,0);x.stroke();rr(-17,-54,34,39,9,'#f08b32');x.fillStyle='#f0c49a';x.beginPath();x.arc(0,-65,14,0,7);x.fill();x.fillStyle='#252b39';x.beginPath();x.arc(0,-71,14,Math.PI,0);x.fill();x.restore();items=items.filter(o=>o.z<1.1&&!o.done)}
function end(){run=false;best=Math.max(best,s);localStorage.vmsrunBest=best;$('best').textContent=best;$('panel').innerHTML='<h1>FIM DE JOGO</h1><p>Pontos: '+s+'<br>Moedas: '+coin+'<br>Recorde: '+best+'</p><button class="primary" id="again">JOGAR DE NOVO</button>';$('overlay').style.display='flex';$('again').onclick=start}
function tick(dt){if(run){t+=dt;s+=Math.floor(dt*spd*250);spd=Math.min(.7,spd+dt*.002);spawn-=dt;if(spawn<=0){add();spawn=Math.max(.45,1.1-spd)}for(let o of items){o.z+=dt*spd;if(o.z>.83&&!o.done){if(o.kind==='coin'&&o.l===lane){coin++;o.done=true;$('coins').textContent=coin}else if(o.kind!=='coin'&&o.l===lane&&j<.25){end();break}else if(o.kind!=='coin'&&o.l===lane)o.done=true}}j=Math.max(0,j-dt*1.8);$('score').textContent=s.toLocaleString('pt-BR')}}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;tick(dt);world();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function start(){t=s=coin=lane=j=0;spd=.36;spawn=.4;items=[];run=true;$('score').textContent=$('coins').textContent='0';$('overlay').style.display='none'}
function move(n){if(run)lane=Math.max(-1,Math.min(1,lane+n))}function jump(){if(run)j=1}
$('start').onclick=start;$('left').onpointerdown=()=>move(-1);$('right').onpointerdown=()=>move(1);$('jump').onpointerdown=jump;$('slide').onpointerdown=()=>{if(run)j=.25};
$('pause').onclick=()=>{if(!run)return;run=false;$('panel').innerHTML='<h1>PAUSADO</h1><button class="primary" id="resume">CONTINUAR</button><button class="secondary" id="again">RECOMEÇAR</button>';$('overlay').style.display='flex';$('resume').onclick=()=>{run=true;$('overlay').style.display='none'};$('again').onclick=start};
let sx=0,sy=0;c.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};c.onpointerup=e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else if(run)j=.25};onkeydown=e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='ArrowDown'&&run)j=.25}
})();</script></body></html>
