<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>Open World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#86b5d2;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:12px;left:50%;transform:translateX(-50%);color:white;background:#101820bb;padding:9px 14px;border-radius:9px;font-size:12px;white-space:nowrap}
#status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:white;background:#101820aa;padding:8px 12px;border-radius:8px;font-size:11px}
#controls{position:fixed;inset:0;pointer-events:none}
#stick{position:absolute;left:22px;bottom:26px;width:132px;height:132px;border-radius:50%;background:#10182066;border:2px solid #ffffff88;pointer-events:auto;touch-action:none}
#nub{position:absolute;width:54px;height:54px;border-radius:50%;left:37px;top:37px;background:#fff9;border:2px solid white}
.btn{position:absolute;right:18px;bottom:25px;width:100px;height:52px;border:1px solid #ffffff99;border-radius:12px;background:#142333dd;color:white;font-weight:bold;pointer-events:auto}
#jump{bottom:88px}#hint{position:absolute;left:18px;bottom:166px;color:white;text-shadow:0 1px 3px #000;font-size:10px}
#live-update{display:none;position:fixed;z-index:20;top:54px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:10px;background:#f3c94b;color:#171717;font-weight:bold;font-size:12px;border:0;box-shadow:0 3px 12px #0006}
</style>
</head>
<body><div id="game"></div><div id="top">OPEN WORLD • ANDROID</div><div id="status">Carregando mundo 3D...</div><button id="live-update" onclick="location.reload()">ATUALIZAÇÃO DISPONÍVEL • TOQUE PARA APLICAR</button>
<div id="controls"><div id="stick"><div id="nub"></div></div><div id="hint">TOQUE E ARRASTE PARA MOVER</div><button class="btn" id="jump">PULAR</button><button class="btn" id="vehicle">ENTRAR</button></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/FBXLoader.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const status=document.querySelector('#status'), root=document.querySelector('#game');
window.addEventListener('error',e=>{status.textContent='Erro ao iniciar 3D: '+(e.message||'verifique a internet');});
window.addEventListener('unhandledrejection',e=>{status.textContent='Falha ao carregar recurso 3D • confira a internet';console.error(e.reason);});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fc3df);scene.fog=new THREE.Fog(0x8fc3df,65,180);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x64745c,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-25,45,20);scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.82});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),mat(0x528b54));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);
function block(x,z,w,d,h,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));m.position.set(x,h/2,z);scene.add(m);return m}
block(0,.0,9,.0+180,.12,0x30343a);block(0,0,180,9,.12,0x30343a);

// Cidade 3D com volumes arquitetônicos e janelas/balcões instanciados (leve para celular).
const glassMat=new THREE.MeshStandardMaterial({color:0x3f7188,metalness:.22,roughness:.24});
const frameMat=mat(0xd9d1c2), balconyMat=mat(0x777d80), roofMat=mat(0x6d7477);
const windowGeo=new THREE.BoxGeometry(1.55,1.45,.14);
const sideWindowGeo=new THREE.BoxGeometry(.14,1.35,1.8);
const sillGeo=new THREE.BoxGeometry(1.82,.16,.34);
const sideSillGeo=new THREE.BoxGeometry(.34,.16,2.0);
const balconyGeo=new THREE.BoxGeometry(2.25,.16,.9);
const doorGeo=new THREE.BoxGeometry(1.35,2.2,.16);
const windowInstances=new THREE.InstancedMesh(windowGeo,glassMat,5000);
const sideWindowInstances=new THREE.InstancedMesh(sideWindowGeo,glassMat,5000);
const sillInstances=new THREE.InstancedMesh(sillGeo,frameMat,5000);
const sideSillInstances=new THREE.InstancedMesh(sideSillGeo,frameMat,5000);
const balconyInstances=new THREE.InstancedMesh(balconyGeo,balconyMat,2500);
const doorInstances=new THREE.InstancedMesh(doorGeo,new THREE.MeshStandardMaterial({color:0x203847,metalness:.15,roughness:.28}),500);
const dummy=new THREE.Object3D();
let wi=0,swi=0,si=0,ssi=0,bi=0,di=0;
function put(mesh,index,x,y,z,ry=0,sx=1,sy=1,sz=1){
 dummy.position.set(x,y,z);dummy.rotation.set(0,ry,0);dummy.scale.set(sx,sy,sz);dummy.updateMatrix();mesh.setMatrixAt(index,dummy.matrix);
}
function detailedBuilding(x,z,w,d,h,color,index){
 const floors=Math.max(2,Math.floor(h/2.7));
 const shell=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));shell.position.set(x,h/2,z);scene.add(shell);
 // Base, cobertura e platibanda com profundidade real
 const base=new THREE.Mesh(new THREE.BoxGeometry(w+.55,.38,d+.55),mat(0x777b7b));base.position.set(x,.19,z);scene.add(base);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.7,.34,d+.7),roofMat);roof.position.set(x,h+.17,z);scene.add(roof);
 const parapet=new THREE.Mesh(new THREE.BoxGeometry(w+.35,.72,.28),frameMat);parapet.position.set(x,h+.65,z-d/2);scene.add(parapet);
 // Volume lateral deslocado para quebrar o formato de caixa simples
 if(index%3===0){const wing=new THREE.Mesh(new THREE.BoxGeometry(w*.32,h*.72,d*.7),mat(color-0x080808));wing.position.set(x+w*.34,h*.36,z-d*.12);scene.add(wing);}
 // Colunas e faixas verticais na fachada
 for(const side of [-1,1]){
  const pilaster=new THREE.Mesh(new THREE.BoxGeometry(.22,h,.24),frameMat);pilaster.position.set(x+side*(w/2-.12),h/2,z+d/2+.08);scene.add(pilaster);
 }
 for(let floor=0;floor<floors;floor++){
  const y=1.15+floor*2.7;
  for(let col=0;col<3;col++){
   const wx=x+(col-1)*(w/3);
   for(const side of [-1,1]){
    put(windowInstances,wi++,wx,y,z+side*(d/2+.09));
    put(sillInstances,si++,wx,y-.8,z+side*(d/2+.18));
    if(floor>0 && (col===0||col===2)){
     put(balconyInstances,bi++,wx,y-.72,z+side*(d/2+.42),0,1,1,1);
    }
   }
  }
  for(let col=0;col<2;col++)for(const side of [-1,1]){
   put(sideWindowInstances,swi++,x+side*(w/2+.09),y,z+(col-.5)*(d*.55));
   put(sideSillInstances,ssi++,x+side*(w/2+.18),y-.78,z+(col-.5)*(d*.55));
  }
 }
 put(doorInstances,di++,x,.98,z+d/2+.12);
 // Marquise comercial projetada para fora
 const canopy=new THREE.Mesh(new THREE.BoxGeometry(w*.78,.22,1.15),mat(index%2?0x384c5b:0x8a5c42));canopy.position.set(x,2.35,z+d/2+.58);scene.add(canopy);
 // Caixa d'água, casa de máquinas e dutos no telhado
 const rooftop=new THREE.Mesh(new THREE.BoxGeometry(w*.34,.9,d*.38),mat(0x999b96));rooftop.position.set(x-w*.18,h+.78,z);scene.add(rooftop);
 const vent=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,.8,8),mat(0x555d62));vent.position.set(x+w*.28,h+.62,z-d*.2);scene.add(vent);
}
let buildingIndex=0;
for(let i=-4;i<=4;i++)for(let j=-4;j<=4;j++){
 if(i===0||j===0)continue;
 const x=i*17,z=j*17,h=9+((i*i+j*j)%5)*2.4;
 const colors=[0xb9b4a8,0x9cabb4,0xc2b39d,0x8d9caa,0xb5a7a0];
 detailedBuilding(x,z,11,11,h,colors[(i-j+25)%colors.length],buildingIndex++);
}
for(const mesh of [windowInstances,sideWindowInstances,sillInstances,sideSillInstances,balconyInstances,doorInstances]){
 mesh.count=mesh===windowInstances?wi:mesh===sideWindowInstances?swi:mesh===sillInstances?si:mesh===sideSillInstances?ssi:mesh===balconyInstances?bi:di;
 mesh.instanceMatrix.needsUpdate=true;scene.add(mesh);
}
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.BoxGeometry(.65,1,.38),mat(0x174eaa));body.position.y=1;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),mat(0xc99570));head.position.y=1.68;player.add(head);
player.position.set(0,0,3);

// Personagem Ch46 (FBX) + animações Idle/Running do repositório original.
const characterBase='https://raw.githubusercontent.com/dasprino007/Personagem-3D/main/Assets/Personagens/';
const animationBase='https://raw.githubusercontent.com/dasprino007/Personagem-3D/main/Assets/Animations/';
const textureBase=characterBase+'Textures/';
const neutralTexture='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jYV8AAAAASUVORK5CYII=';
const characterManager=new THREE.LoadingManager();
characterManager.setURLModifier(url=>{
 const name=decodeURIComponent(url.split(/[\\/]/).pop());
 if(/\.(png|jpe?g)$/i.test(name)) return /diffuse/i.test(name)?textureBase+name:neutralTexture;
 return url;
});
const characterLoader=new FBXLoader(characterManager);
let characterMixer=null,idleAction=null,runAction=null,isMoving=false,characterReady=false;
function updateCharacterAnimation(running){
 if(running===isMoving)return;
 isMoving=running;
 const next=running?runAction:idleAction,previous=running?idleAction:runAction;
 if(next){next.reset().fadeIn(.18).play();if(previous)previous.fadeOut(.18);}
}
characterLoader.load(characterBase+'Ch46_nonPBR.fbx',model=>{
 const bounds=new THREE.Box3().setFromObject(model),size=bounds.getSize(new THREE.Vector3());
 const scale=1.8/Math.max(size.y,.001);
 model.scale.setScalar(scale);
 model.position.set(-((bounds.min.x+bounds.max.x)/2)*scale,-bounds.min.y*scale,-((bounds.min.z+bounds.max.z)/2)*scale);
 model.traverse(o=>{
  if(!o.isMesh)return;
  o.castShadow=false;o.receiveShadow=false;
  const materials=Array.isArray(o.material)?o.material:[o.material];
  materials.forEach(m=>{if(!m)return;m.normalMap=null;m.bumpMap=null;m.roughnessMap=null;m.metalnessMap=null;m.aoMap=null;m.roughness=.88;m.metalness=0;if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;m.needsUpdate=true;});
 });
 player.clear();player.add(model);characterReady=true;
 characterMixer=new THREE.AnimationMixer(model);
 status.textContent='Personagem 3D carregado • preparando animações';
 characterLoader.load(animationBase+'Ch46_nonPBR@Breathing%20Idle.fbx',idle=>{
  if(!idle.animations.length)return;
  idleAction=characterMixer.clipAction(idle.animations[0]);
  if(!isMoving)idleAction.play();
 });
 characterLoader.load(animationBase+'Ch46_nonPBR@Running.fbx',running=>{
  if(!running.animations.length)return;
  runAction=characterMixer.clipAction(running.animations[0]);
  if(isMoving)runAction.play();
 });
},undefined,error=>{
 console.error('Falha ao carregar personagem FBX:',error);
 status.textContent='Personagem provisório • falha ao carregar FBX remoto';
});
let car=new THREE.Group();scene.add(car);car.position.set(0,0,-5.5);
const carBody=new THREE.Mesh(new THREE.BoxGeometry(2,0.62,4),new THREE.MeshStandardMaterial({color:0xb91e22,metalness:.55,roughness:.3}));carBody.position.y=.68;car.add(carBody);
const cab=new THREE.Mesh(new THREE.BoxGeometry(1.48,.72,1.9),new THREE.MeshStandardMaterial({color:0x1b303e,metalness:.2,roughness:.25}));cab.position.set(0,1.28,-.12);car.add(cab);
let carLoaded=false;
new GLTFLoader().load('https://raw.githubusercontent.com/shliamin/JS-3D-Car/main/models/ferrari.glb',g=>{
 const model=g.scene;const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3());
 const scale=4.1/Math.max(size.x,size.y,size.z);model.scale.setScalar(scale);
 const b2=new THREE.Box3().setFromObject(model),center=b2.getCenter(new THREE.Vector3());
 model.position.set(-center.x*scale,-b2.min.y*scale,-center.z*scale);
 car.clear();car.add(model);carLoaded=true;status.textContent='Ferrari 3D carregada • entre no veículo';
},undefined,e=>{status.textContent='Carro provisório ativo • falha ao carregar modelo remoto';});
let driving=false,speed=0,yaw=0,jump=0,move={x:0,y:0},last=performance.now();
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let pointer=null;
function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=43,k=Math.min(1,max/(len||1));move.x=dx*k/max;move.y=-dy*k/max;nub.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);setStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)setStick(e)});
function release(e){if(e.pointerId===pointer){pointer=null;move={x:0,y:0};nub.style.transform=''}}
stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
document.querySelector('#vehicle').onclick=()=>{if(driving){driving=false;player.position.copy(car.position);player.position.x+=Math.cos(yaw)*2;player.position.z+=Math.sin(yaw)*2;document.querySelector('#vehicle').textContent='ENTRAR'}else if(player.position.distanceTo(car.position)<5){driving=true;player.position.copy(car.position);document.querySelector('#vehicle').textContent='SAIR'}};
document.querySelector('#jump').onclick=()=>{if(!driving)jump=1};
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;
 if(driving){if(Math.abs(move.y)>.03){yaw+=move.x*dt*1.7*Math.sign(move.y);speed=THREE.MathUtils.damp(speed,move.y*13,2.5,dt)}else speed=THREE.MathUtils.damp(speed,0,2,dt);car.rotation.y=yaw;car.position.x-=Math.sin(yaw)*speed*dt;car.position.z-=Math.cos(yaw)*speed*dt}
 else{const forward=camera.getWorldDirection(new THREE.Vector3());forward.y=0;forward.normalize();const right=new THREE.Vector3(-forward.z,0,forward.x);const direction=right.multiplyScalar(move.x).add(forward.multiplyScalar(move.y));if(direction.lengthSq()>.0001){direction.normalize();player.position.addScaledVector(direction,5*dt);player.rotation.y=Math.atan2(direction.x,direction.z)}}
 updateCharacterAnimation(!driving&&Math.hypot(move.x,move.y)>.1);
 if(characterMixer)characterMixer.update(dt);
 if(jump>0){player.position.y=Math.sin((1-jump)*Math.PI)*1.1;jump-=dt*1.7;if(jump<=0){jump=0;player.position.y=0}}
 const target=driving?car.position:player.position;const angle=driving?yaw:camera.rotation.y;
 const desired=new THREE.Vector3(target.x+Math.sin(angle)*9,5.5,target.z+Math.cos(angle)*9);
 camera.position.lerp(desired,.12);camera.lookAt(target.x,1.1,target.z);
 renderer.render(scene,camera);
}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
status.textContent='Mundo pronto • aproxime-se do carro para entrar';
</script><script>
(async function liveUpdateCheck(){
 const versionUrl='https://raw.githubusercontent.com/ffuxyxfyxhcocyocg-art/OPEN-WORLD-ANDROID/main/version.txt';
 let current='1';
 try{const r=await fetch(versionUrl+'?t='+Date.now(),{cache:'no-store'});if(r.ok)current=(await r.text()).trim();}catch(e){}
 setInterval(async()=>{
  try{const r=await fetch(versionUrl+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
   const latest=(await r.text()).trim();
   if(latest&&latest!==current){document.getElementById('live-update').style.display='block';}
  }catch(e){}
 },60000);
})();
</script></body></html>
